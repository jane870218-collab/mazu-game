
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#a83d60">
<title>關廟天后宮｜媽祖知我心</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#fff5f2;color:#573b43;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif}
header{background:linear-gradient(135deg,#852c49,#d96c82);color:white;text-align:center;padding:28px 16px}
header h1{font-size:30px;margin:8px 0}
header p{margin:5px 0;font-size:16px}
main{max-width:620px;margin:20px auto;padding:0 15px 35px}
.panel{background:white;border-radius:24px;padding:25px 19px;margin-bottom:20px;box-shadow:0 7px 25px #853d4920}
.center{text-align:center}
.hidden{display:none!important}
.logo{width:220px;max-width:85%;height:auto;display:block;margin:0 auto 18px;object-fit:contain}
h2{color:#a52d4d;font-size:24px;line-height:1.5}
h3{color:#a52d4d}
p{line-height:1.85}
.btn{display:block;width:100%;border:0;border-radius:16px;padding:16px 15px;background:#b43b62;color:white;font-size:17px;font-weight:bold;cursor:pointer;margin:12px 0;line-height:1.5}
.btn:active{transform:scale(.98)}
.secondary{background:#f4e5e9;color:#81334d}
.option{background:#fff7f6;border:1px solid #edcbd3;color:#613d48;text-align:left}
.progress{height:9px;background:#f1dce2;border-radius:20px;overflow:hidden;margin:18px 0}
.progress div{height:100%;background:#c24a70;transition:width .3s}
.photo{width:100%;aspect-ratio:3/4;object-fit:cover;object-position:center;border-radius:18px;display:block;background:#f6edf0}
.deity-card{max-width:340px;margin:15px auto;padding:12px;border-radius:22px;background:#fff6f5;border:1px solid #f1d9d9}
.deity-card h3{margin:12px 0 3px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}
.grid .deity-card{margin:0;padding:8px}
.grid h3{font-size:17px}
.small{font-size:13px;color:#876d73}
.note{background:#fff4e6;padding:15px;border-radius:14px}
#result h2{margin-bottom:8px}
#result p{text-align:left}
footer{text-align:center;font-size:12px;color:#937880;padding:15px}
</style>
</head>
<body>
<header>
<h1>🌸 關廟天后宮 🌸</h1>
<p>媽祖知我心・尋找此刻的守護</p>
</header>
<main>
<section id="home" class="panel center">
<img class="logo" src="359B22C4-D8F0-4BEE-B4DA-9D9E5E941D23.png" alt="關廟天后宮Logo">
<h2>🌷 媽祖知我心 🌷</h2>
<p>每個人的心中，都有一段正在經歷的故事。</p>
<p>透過五個簡單的問題，探索你此刻最需要的溫暖與支持。</p>
<p>讓關廟天后宮的媽祖們，陪你找到心中的力量。</p>
<button class="btn" onclick="startGame()">🌸 開始心境探索</button>
<button class="btn secondary" onclick="showGallery()">認識八尊媽祖</button>
</section>

<section id="quiz" class="panel hidden">
<div id="counter" class="small"></div>
<div class="progress"><div id="bar"></div></div>
<h2 id="question"></h2>
<div id="options"></div>
<button class="btn secondary" onclick="goBack()">返回上一題</button>
</section>

<section id="result" class="panel hidden">
<div class="center">🌸 關廟天后宮・專屬守護卡 🌸</div>
<h2 id="topic" class="center"></h2>
<div id="deity"></div>
<h3>💗 你的心境分析</h3>
<p id="analysis"></p>
<h3>🌱 現在可以做的一件事</h3>
<p id="advice"></p>
<h3>🙏 給你的溫暖提醒</h3>
<p id="message"></p>
<h3>另一個值得關注的面向</h3>
<p id="secondary"></p>
<p class="small">本測驗為民俗文化與自我探索體驗，不代表神明正式指示，也不取代醫療、法律或專業建議。</p>
<button class="btn" onclick="shareGame()">分享遊戲給朋友</button>
<button class="btn secondary" onclick="startGame()">重新測驗</button>
<button class="btn secondary" onclick="showGallery()">認識八尊媽祖</button>
</section>

<section id="gallery" class="panel hidden">
<h2 class="center">🌺 關廟天后宮媽祖介紹</h2>
<div id="galleryGrid" class="grid"></div>
<button class="btn" onclick="startGame()">開始心境探索</button>
<button class="btn secondary" onclick="showHome()">返回首頁</button>
</section>
</main>
<footer>關廟天后宮｜媽祖知我心 V2</footer>
<script>
const deities=[
{name:"天三聖母（主公）",file:"IMG_3171.jpeg",role:"整體方向與心靈力量",analysis:"你可能正面對重要轉折，心裡有許多責任與期待。你需要的，是先安定自己，再看清前方的道路。",advice:"寫下目前最重要的一件事，先完成能掌握的第一步。",message:"方向不必一次看得很遠，願你在紛擾中找到內心的安定。"},
{name:"鎮殿大媽",file:"IMG_3167.jpeg",role:"安定與守護",analysis:"你一直努力照顧身邊的人，也可能忽略了自己的需要。此刻適合放慢腳步，重新整理心情。",advice:"今天留十五分鐘給自己，好好休息。",message:"願溫柔成為你的力量，讓心慢慢安定下來。"},
{name:"二媽",file:"IMG_3166.jpeg",role:"姻緣與感情",analysis:"你重視關係中的理解與陪伴，或許正期待一段關係能夠更加靠近。",advice:"向重要的人表達一句真誠的關心，也記得尊重彼此界線。",message:"願你被珍惜，也懂得珍惜自己。"},
{name:"港口正三媽",file:"IMG_3172.jpeg",role:"平安與心靈支持",analysis:"你可能正在尋找安全感，希望心中的擔憂能慢慢放下。",advice:"先整理最讓你掛心的事情，找一位信任的人談談。",message:"願你出入平安，心中有光。"},
{name:"四媽",file:"IMG_3176.jpeg",role:"法律、土地與公道",analysis:"你在意公平與原則，也可能正面對權益、土地或人際爭議。",advice:"把事情的經過、日期及相關資料整理清楚，必要時尋求專業協助。",message:"願你堅守正道，也能以冷靜與智慧面對挑戰。"},
{name:"五媽",file:"IMG_3168.jpeg",role:"工作與事業",analysis:"你對工作與未來有期待，也可能正承受選擇或責任帶來的壓力。",advice:"列出工作上最重要的三項優先事項，從最可行的一項開始。",message:"願你的努力逐漸累積成成果，也保有生活的平衡。"},
{name:"六媽",file:"IMG_3169.jpeg",role:"人緣與人際關係",analysis:"你希望與他人有良好互動，也可能因為誤解或期待而感到疲憊。",advice:"主動釐清一件誤會，並保留適當的個人界線。",message:"願你遇見真誠善意的人，也自在地做自己。"},
{name:"太平媽",file:"IMG_3173.jpeg",role:"平安與家庭和諧",analysis:"你很在乎家人的平安與生活安穩，可能習慣把家人的需要放在自己之前。",advice:"和家人安排一段輕鬆相處的時間，分享彼此最近的心情。",message:"願一家人平安順心，在平凡日常中感受幸福。"}
];

const questions=[
{q:"此刻，你最希望生活中哪一件事能變得更好？",a:[
["找到人生方向",[0,1]],
["感情與陪伴",[2,6]],
["身心平安",[3,7]],
["工作與未來",[5,0]],
["公平與權益",[4,0]],
["家庭和諧",[7,1]]
]},
{q:"當你遇到煩惱時，最常出現什麼感受？",a:[
["不知道下一步該怎麼走",[0,5]],
["希望有人理解我",[2,6]],
["擔心自己或家人的狀況",[3,7]],
["覺得努力還不夠",[5,1]],
["感到委屈或不公平",[4,6]],
["只想好好休息",[1,7]]
]},
{q:"如果現在可以獲得一份支持，你最希望是什麼？",a:[
["智慧與勇氣",[0,4]],
["溫暖的陪伴",[2,1]],
["平安與安心",[3,7]],
["事業上的信心",[5,0]],
["有人願意站在公道的一方",[4,6]],
["良好的人際關係",[6,2]]
]},
{q:"你最近最想改善哪一種生活狀態？",a:[
["做決定時的猶豫",[0,5]],
["與另一半或重要的人相處",[2,6]],
["身心疲憊與擔憂",[3,1]],
["工作上的壓力",[5,0]],
["權益與爭議",[4,0]],
["家人之間的溝通",[7,6]]
]},
{q:"如果對未來許下一個心願，你會選擇？",a:[
["找到適合自己的道路",[0,1]],
["感情順利、有人相伴",[2,6]],
["平安健康、心情安穩",[3,7]],
["工作順利、努力有成果",[5,0]],
["事情得到公平合理的處理",[4,0]],
["家庭和樂、人緣順心",[7,6]]
]}
];

let step=0,answers=[];
function el(id){return document.getElementById(id)}
function show(id){
["home","quiz","result","gallery"].forEach(x=>el(x).classList.toggle("hidden",x!==id));
window.scrollTo(0,0);
}
function showHome(){show("home")}
function startGame(){step=0;answers=[];show("quiz");renderQuestion()}
function renderQuestion(){
let q=questions[step];
el("counter").textContent="第 "+(step+1)+" 題，共 5 題";
el("bar").style.width=((step+1)/5*100)+"%";
el("question").textContent=q.q;
el("options").innerHTML="";
q.a.forEach((item,i)=>{
let b=document.createElement("button");
b.className="btn option";
b.textContent=item[0];
b.onclick=()=>choose(i);
el("options").appendChild(b);
});
}
function choose(i){
answers[step]=i;
if(step===4){showResult();return}
step++;renderQuestion();
}
function goBack(){
if(step===0){showHome();return}
step--;renderQuestion();
}
function getRanking(){
let scores=Array(8).fill(0);
answers.forEach((choice,qi)=>{
let ids=questions[qi].a[choice][1];
scores[ids[0]]+=3;
scores[ids[1]]+=1;
});
return scores.map((score,i)=>({score,i}))
.sort((a,b)=>b.score-a.score||a.i-b.i);
}
function photoCard(d){
let box=document.createElement("div");
box.className="deity-card center";
let img=document.createElement("img");
img.className="photo";
img.src=d.file;
img.alt=d.name;
img.loading="lazy";
let title=document.createElement("h3");
title.textContent=d.name;
let role=document.createElement("div");
role.className="small";
role.textContent=d.role;
box.append(img,title,role);
return box;
}
function showResult(){
let ranks=getRanking();
let d=deities[ranks[0].i];
let other=deities[ranks[1].i];
el("topic").textContent="此刻與你最契合的守護方向";
el("deity").replaceChildren(photoCard(d));
el("analysis").textContent=d.analysis;
el("advice").textContent=d.advice;
el("message").textContent=d.message;
el("secondary").textContent="你也可以關注「"+other.name+"」所象徵的「"+other.role+"」。";
show("result");
}
function showGallery(){
el("galleryGrid").replaceChildren(...deities.map(photoCard));
show("gallery");
}
async function shareGame(){
let url=location.origin+location.pathname;
let data={title:"關廟天后宮｜媽祖知我心",text:"一起透過五個問題探索此刻的心境，認識媽祖的溫暖守護。",url};
try{
if(navigator.share){await navigator.share(data)}
else if(navigator.clipboard){
await navigator.clipboard.writeText(url);
alert("遊戲連結已複製，可以貼到LINE或Facebook分享。");
}else{prompt("請複製遊戲連結",url)}
}catch(e){
if(e.name!=="AbortError")prompt("請複製遊戲連結",url);
}
}
</script>
</body>
</html>
